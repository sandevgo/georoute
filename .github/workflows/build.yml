name: Build binary

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"

      - name: Run tests
        run: go test ./...

  build:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact_name: georoute-linux-amd64
            binary_name: georoute
          - goos: linux
            goarch: arm64
            artifact_name: georoute-linux-arm64
            binary_name: georoute
          - goos: darwin
            goarch: amd64
            artifact_name: georoute-darwin-amd64
            binary_name: georoute
          - goos: darwin
            goarch: arm64
            artifact_name: georoute-darwin-arm64
            binary_name: georoute
          - goos: windows
            goarch: amd64
            artifact_name: georoute-windows-amd64
            binary_name: georoute.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.binary_name }}" ./cmd

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.binary_name }}
          if-no-files-found: error
