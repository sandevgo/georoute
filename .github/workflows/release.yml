name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"

      - name: Run tests
        run: go test ./...

  build-release:
    name: Build release (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive_name: georoute-linux-amd64.gz
            archive_format: gz
            binary_name: georoute
          - goos: linux
            goarch: arm64
            archive_name: georoute-linux-arm64.gz
            archive_format: gz
            binary_name: georoute
          - goos: darwin
            goarch: amd64
            archive_name: georoute-darwin-amd64.gz
            archive_format: gz
            binary_name: georoute
          - goos: darwin
            goarch: arm64
            archive_name: georoute-darwin-arm64.gz
            archive_format: gz
            binary_name: georoute
          - goos: windows
            goarch: amd64
            archive_name: georoute-windows-amd64.zip
            archive_format: zip
            binary_name: georoute.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.binary_name }}" ./cmd

      - name: Create archive
        run: |
          if [ "${{ matrix.archive_format }}" = "zip" ]; then
            zip -j "dist/${{ matrix.archive_name }}" "dist/${{ matrix.binary_name }}"
          else
            gzip -c "dist/${{ matrix.binary_name }}" > "dist/${{ matrix.archive_name }}"
          fi

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: dist/${{ matrix.archive_name }}
          if-no-files-found: error

  create-release:
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: georoute-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
          draft: true
